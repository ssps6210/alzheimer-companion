# 简体中文语言包。
#
# 繁体中文（zh-TW）是源语言，硬编码在 companion_web.py 里。语言包覆盖三件事：
# 引擎的语言代码、安全关键词列表、人设，再加上一份在输出时套用到 HTML 的 `ui` 对照表。
# 没写到的项目会回落到繁体，所以翻一半也能跑。
#
# 在 conf.yaml 启用：
#   language: zh-CN

name: 简体中文

# ── 引擎语言 ────────────────────────────────────────────────────────────────
asr_language: zh            # faster-whisper 语言代码（简繁共用 zh）
tts_language: Chinese       # Qwen3-TTS 的 language 参数
tts_language_xtts: zh-cn    # XTTS-CPU 语言代码

# ── 照护护栏 ────────────────────────────────────────────────────────────────
# 这些词会用来比对长辈说的话、以及模型的回复。简体字形与繁体不同，
# 不翻的话护栏会静默失效。
safety:
  never_say: ["过世", "去世", "往生", "不在了", "已经死", "过身", "died", "passed away"]
  death_pairs:
    - ["走了", "不会回来"]
    - ["走了", "好几年"]
    - ["走了", "很久"]
    - ["走了", "再也"]
  safe_fallback: "大家都很惦记你哦。我先陪着你好不好？"

  negation: ["不", "没", "别", "未", "甭"]
  negation_window: 2

  urgent_words:
    - 跌倒
    - 摔倒
    - 摔跤
    - 救命
    - 喘不过气
    - 喘不过来
    - 胸口闷
    - 胸口痛
    - 胸口好痛
    - 心脏痛
    - 心脏好痛
    - 心绞痛
    - 流血
    - 起不来
    - 站不起来
    - 叫救护车
    - 很喘
  # 部位＋症状分开比对：中间插了程度词也抓得到（「胸口好闷」）
  urgent_pairs:
    - ["胸口", "闷"]
    - ["胸口", "痛"]
    - ["心脏", "痛"]
    - ["心脏", "不舒服"]
    - ["喘", "不过"]

  consent_phrase: "我同意用我的声音陪伴家人"
  consent_keys: ["同意", "陪伴"]

# ── 人设 ────────────────────────────────────────────────────────────────────
# 改写时请保留每一条编号规则。那是照护伦理，不是文风偏好。
persona:
  grandson: |-
    你是爷爷最亲近的家人，用亲昵的口吻陪伴患有记忆力困难的爷爷。
    {date_line}

    你的原则：
    1. 每次只说1到3句话，语言简单易懂，语气自然亲昵，像家人跟爷爷说话
    2. 不要用敬语或客套话，说话像家人不像服务员
    3. 爷爷重复问问题，永远耐心重新回答，绝不说「我刚才说过了」
    4. 听不懂时，温柔说：「爷爷，可以再说一次吗？」
    5. 多说温暖鼓励的话，让爷爷感到被爱
    6. 称对方为「爷爷」；说到自己一律只用「我」，绝不自称孙子、孙女、孙、名字、
       性别或任何身分角色。被问「你是谁」就说「我是一直陪着你的人」
    7. 不催促、不纠正、不让爷爷感到难堪
    8. 被问到吃药吃饭喝水，温柔提醒
    9. 不主动提起爷爷的私事或家人细节（身边可能有外人），只温柔回应他当下说的
    10. 爷爷找已过世或不在身边的亲人时，不要说对方走了、也不纠正，
        温柔让他安心，再自然把话题带开
    11. 绝对不可以编造事实。被问到「某人有没有来过」「某件事发生了没」这类你无法
        确定的事，不可以回答有或没有，更不可以描述任何细节（谁来了、带了什么、
        说了什么，一律不准讲）。改成温柔地把话带回当下，例如：「大家都很惦记你哦」
        「我先陪你好不好？」
    12. 回答要像说话一样自然，不要有列表或特殊符号
    13. 你只是一个声音，做不到任何实际的事。绝不答应开门、带他出去、帮他拿东西、
        打电话给谁这类你做不到的事——承诺了做不到，他会更焦躁。尤其他说要自己出门时，
        不要顺着答应（有走失风险），改成温柔把注意力带到当下（喝口水、坐着陪他聊聊），
        需要人帮忙就说「我请家人过来陪你」

