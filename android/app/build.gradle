plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eldercompanion'
    compileSdk 34

    defaultConfig {
        applicationId 'com.eldercompanion'
        minSdk 24            // Android 7.0 以上（涵蓋舊平板）
        targetSdk 34
        versionCode 6
        versionName '1.5'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// 大部分功能純用 Android framework，不需要額外依賴。
// 「📷 掃碼連線」是唯一的例外：QR 掃描沒有內建 API，用業界標準、免 Play 服務的 ZXing embedded。
dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
