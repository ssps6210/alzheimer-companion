# 無顯卡 CPU 版設定範本 —— 複製成 conf.yaml：
#   copy conf.cpu.example.yaml conf.yaml
# 與 conf.example.yaml 的唯一差別是「語音辨識改用 CPU」＋逾時放寬；其餘沿用內建預設（爺爺人設等）。
#
# 隱私：聲音、照片、對話記錄都留在「你自己的電腦」。
#       大腦 LLM 也預設跑在本機（見下方 llm: 區塊），對話文字不會離開這台電腦。
#       只有你自己在 fallback_api_key_env 填了金鑰、且本機模型沒在跑時，
#       才會改用雲端備援，這時離開本機的只有對話「文字」。

# 介面／語音／照護護欄的語言。可用：zh-TW（預設，繁體）、zh-CN（簡體）、en（English）
# 語言包在 lang/ 目錄。換語言會一併換掉：介面文字、語音辨識與合成語言、
# 安全關鍵詞（緊急詞、禁語）、以及人設——中文關鍵詞在英文部署裡是無效的。
language: zh-TW

asr:                          # 語音辨識（STT）—— CPU
  model: small                # CPU 上 medium 太慢；small 已夠用（要更快可用 base）
  device: cpu
  compute_type: int8          # CPU 量化：快很多、也更省記憶體
  language: zh

llm:                          # 大腦
  # 預設用「本機模型」：不需要任何金鑰，對話文字也不會離開這台電腦。
  # 先裝 Ollama（ollama.com，免費）再 `ollama pull qwen3:4b` 即可。
  base_url: http://localhost:11434/v1
  model: qwen3:4b
  api_key_env: ""              # 本機模型不需要金鑰

  # 本機模型沒在跑時的備援。要用就到 build.nvidia.com 申請免費金鑰填進 .env。
  # 留空 fallback_api_key_env 就是「只用本機、絕不連雲端」。
  fallback_base_url: https://integrate.api.nvidia.com/v1
  fallback_model: nvidia/nemotron-3-super-120b-a12b
  fallback_api_key_env: NVIDIA_API_KEY

  temperature: 0.7
  max_tokens: 80
  timeout: 30
  disable_thinking: true       # 推理模型不關思考的話，內心獨白會漏進回覆被念出來（實測）

tts:                          # 語音合成 —— XTTS-CPU（與 GPU 版同 port，drop-in，companion 免改）
  cosyvoice_url: http://localhost:50000/tts
  cosyvoice_health: http://localhost:50000/health
  cosyvoice_timeout: 90       # CPU 克隆慢，逾時放寬（常用話走固定句秒回墊著）
  edge_voice: zh-TW-YunJheNeural
