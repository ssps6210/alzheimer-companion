# 家庭事實表範本。在家人管理台（/setup）的「🏠 家庭事實表」直接改、按儲存即可；
# 也可以複製成 family.yaml 自己編輯（family.yaml 不會被提交，裡面是你們家的隱私）。
#
# 只寫「確定為真」的事。小幫手只在爺爺問到時拿來回答，不會主動提起、也不會考他；
# 這裡沒寫的，它就說不知道。下面的內容都是假的範例，請整段換成你們家的。
# 每一行以「- 」開頭；不需要的分類整段刪掉或留空就好。

people:            # 人物關係：誰是誰、住哪、多久來一次
  - 大兒子阿明，住台北，通常週末回來
  - 孫子小凱在高雄念大學
  - 看護阿蓮白天都在家

belongings:        # 東西放哪裡：他最常找的東西
  - 老花眼鏡放在電視旁邊的小抽屜
  - 收音機在床頭

routine:           # 每天的作息
  - 早上七點吃早餐，八點吃血壓藥
  - 下午兩點睡午覺

life_story:        # 他的生命故事：可以聊、能讓他開心的往事
  - 年輕時在鹿港做木工，很會做板凳
  - 喜歡聽鄧麗君的歌

upcoming:          # 近期的事（記得過期就刪掉，不然小幫手會講錯）
  - 十一月八日星期六阿明會回來吃飯

comfort:           # 讓他安心的事、讓他不安的事
  - 聊到以前做木工，他會很開心
  - 不要跟他說「你忘記了」

# 喪親固定回答：爺爺找已過世的家人時，每次都用同一句你們家決定好的回答，
# 不讓 AI 每次臨場編不同說法（前後矛盾會讓他更混亂）。
# 要不要說善意的話、怎麼說，是你們家的決定；請寫下是誰、哪天決定的。
# 回答一樣會經過安全防線：含「過世」「出門」這類字眼會被換成安撫語。
bereavement:
  - about: 奶奶
    triggers: [奶奶, 阿嬤, 我太太, 我牽手]   # 爺爺會怎麼稱呼她
    reply: 奶奶剛剛在忙，等一下就好。我們先在這裡坐一下，你跟我說說以前的事好不好？
    approved_by: 阿明
    approved_on: 2026-10-23
